<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>红色风暴 · 献给 Simon</title>
<link rel="icon" type="image/png" sizes="256x256" href="art/favicon.png?v=1">
<link rel="shortcut icon" href="favicon.ico?v=1">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a0f0a; height: 100%; }
  body { position: relative; }
  canvas { display: block; touch-action: none; cursor: default; }
  #audio-settings {
    position: absolute;
    z-index: 2;
    top: 18px;
    right: 18px;
    width: 250px;
    box-sizing: border-box;
    padding: 13px 15px 12px;
    color: #fff0c2;
    background: rgba(20, 12, 8, 0.82);
    border: 1px solid rgba(255, 210, 125, 0.72);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.34);
    font: 14px/1.3 monospace;
    backdrop-filter: blur(4px);
  }
  #audio-settings[hidden] { display: none; }
  #audio-settings h2 { margin: 0 0 9px; color: #ffd27d; font-size: 15px; }
  .audio-setting {
    display: grid;
    grid-template-columns: 72px 1fr 38px;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .audio-setting output { color: #e8c9b0; text-align: right; }
  .audio-setting input { width: 100%; accent-color: #e04c3a; cursor: pointer; }
  #audio-settings small { display: block; margin-top: 9px; color: rgba(216, 184, 160, 0.78); }
  .lang-setting { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
  .lang-setting span { flex: 1; }
  .lang-btn {
    background: transparent;
    border: 1px solid rgba(255, 210, 125, 0.55);
    color: #fff0c2;
    font: 13px monospace;
    padding: 3px 10px;
    cursor: pointer;
  }
  .lang-btn.active { background: #e04c3a; border-color: #e04c3a; color: #fff; }
  @media (max-width: 700px) {
    #audio-settings { top: 10px; right: 10px; width: 225px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<section id="audio-settings" aria-label="声音设置" hidden>
  <h2 id="settings-title">设置</h2>
  <div class="lang-setting">
    <span id="lang-label">语言</span>
    <button id="lang-zh" class="lang-btn" type="button">中文</button>
    <button id="lang-en" class="lang-btn" type="button">English</button>
  </div>
  <label class="audio-setting">
    <span id="bgm-label">背景音乐</span>
    <input id="bgm-volume" type="range" min="0" max="100" step="1" value="100">
    <output id="bgm-volume-value" for="bgm-volume">100%</output>
  </label>
  <label class="audio-setting">
    <span id="sfx-label">游戏音效</span>
    <input id="sfx-volume" type="range" min="0" max="100" step="1" value="100">
    <output id="sfx-volume-value" for="sfx-volume">100%</output>
  </label>
  <label class="audio-setting">
    <span id="atmo-label">氛围厚度</span>
    <input id="atmosphere-volume" type="range" min="0" max="100" step="1" value="70">
    <output id="atmosphere-volume-value" for="atmosphere-volume">70%</output>
  </label>
  <small id="settings-note">设为 0% 可做原声 A/B 对比 · 设置自动保存 · M 键全部静音</small>
</section>
<!-- 零构建:普通 script 标签按顺序加载,双击本文件即可运行 -->
<script src="src/config.js?v=11"></script>
<script src="src/i18n.js?v=1"></script>
<script src="src/art-data.js?v=8"></script>
<script src="src/iso.js?v=5"></script>
<script src="src/map.js?v=7"></script>
<script src="src/units.js?v=13"></script>
<script src="src/field-guide.js?v=5"></script>
<script src="src/sprites.js?v=10"></script>
<script src="src/enemy-art.js?v=9"></script>
<script src="src/camera.js?v=6"></script>
<script src="src/input.js?v=12"></script>
<script src="src/game.js?v=13"></script>
<script src="src/combat.js?v=10"></script>
<script src="src/ai.js?v=8"></script>
<script src="src/audio.js?v=7"></script>
<script src="src/campaign-art.js?v=1"></script>
<script src="src/cutscene.js?v=3"></script>
<script src="src/campaign.js?v=3"></script>
<script src="src/render.js?v=17"></script>
<script src="src/main.js?v=9"></script>
</body>
</html>
